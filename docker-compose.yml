services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: miaupy
      POSTGRES_USER: miaupy
      POSTGRES_PASSWORD: miaupy
    ports:
      - "5432:5432"
    volumes:
      - miaupy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miaupy -d miaupy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - miaupy-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/miaupy
      KC_DB_USERNAME: miaupy
      KC_DB_PASSWORD: miaupy
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${IDENTITY_PUBLIC_URL:-http://localhost:3000/identity}
      KC_HOSTNAME_ADMIN: ${IDENTITY_ADMIN_URL:-http://localhost:9000}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      MIAUPY_ONBOARDING_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:-local-onboarding-secret-change-me}
    ports:
      - "9000:8080"
    volumes:
      # --import-realm processes every JSON in this directory. Mount only the realm export;
      # miaupy-user-profile.json is applied separately by the keycloak-config service below.
      - ./infra/keycloak/miaupy-realm.json:/opt/keycloak/data/import/miaupy-realm.json:ro
      - ./infra/keycloak/themes/miaupy:/opt/keycloak/themes/miaupy:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.7.0
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        until /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user "$${KEYCLOAK_ADMIN_USERNAME}" --password "$${KEYCLOAK_ADMIN_PASSWORD}"; do sleep 2; done
        /opt/keycloak/bin/kcadm.sh update users/profile -r miaupy -f /config/miaupy-user-profile.json
        /opt/keycloak/bin/kcadm.sh update realms/miaupy -s loginTheme=miaupy -s internationalizationEnabled=true -s defaultLocale=pt-BR
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-change-me}
    volumes:
      - ./infra/keycloak/miaupy-user-profile.json:/config/miaupy-user-profile.json:ro
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

volumes:
  miaupy-postgres:
  miaupy-redis:
