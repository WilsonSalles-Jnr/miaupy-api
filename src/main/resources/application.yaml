spring:
  application:
    name: miaupy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/miaupy}
    username: ${DB_USERNAME:miaupy}
    password: ${DB_PASSWORD:miaupy}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}] [tenantId=%X{tenantId:-}] [actorId=%X{actorId:-}]"

miaupy:
  cache:
    public-catalog-ttl: ${PUBLIC_CATALOG_CACHE_TTL:PT5M}
  kafka:
    domain-events-topic: ${DOMAIN_EVENTS_TOPIC:miaupy.domain-events}
  outbox:
    publish-delay: ${OUTBOX_PUBLISH_DELAY:PT2S}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true
    try-it-out-enabled: true
