spring:
  application:
    name: miaupy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/miaupy}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:3000/identity/realms/miaupy}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/realms/miaupy/protocol/openid-connect/certs}
          audiences: ${AUTH_AUDIENCE:miaupy-api}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_GROUP:miaupy-notifications-v1}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: ${CLINICAL_ATTACHMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${CLINICAL_ATTACHMENT_MAX_REQUEST_SIZE:11MB}

server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}] [tenantId=%X{tenantId:-}] [actorId=%X{actorId:-}]"

miaupy:
  identity:
    base-url: ${IDENTITY_BASE_URL:http://localhost:9000}
    realm: ${IDENTITY_REALM:miaupy}
    client-id: ${IDENTITY_CLIENT_ID:miaupy-onboarding-service}
    client-secret: ${IDENTITY_CLIENT_SECRET:local-onboarding-secret-change-me}
    consumer-client-id: ${IDENTITY_CONSUMER_CLIENT_ID:miaupy-consumer}
    business-client-id: ${IDENTITY_BUSINESS_CLIENT_ID:miaupy-business}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  onboarding:
    registration:
      ip-limit-per-hour: ${REGISTRATION_IP_LIMIT_PER_HOUR:10}
      email-limit-per-hour: ${REGISTRATION_EMAIL_LIMIT_PER_HOUR:3}
      key-secret: ${REGISTRATION_KEY_SECRET:local-rate-limit-secret-change-me}
  cache:
    public-catalog-ttl: ${PUBLIC_CATALOG_CACHE_TTL:PT5M}
  kafka:
    domain-events-topic: ${DOMAIN_EVENTS_TOPIC:miaupy.domain-events}
  outbox:
    publish-delay: ${OUTBOX_PUBLISH_DELAY:PT2S}
  notification:
    from: ${NOTIFICATION_FROM:no-reply@miaupy.local}
    delivery-delay: ${NOTIFICATION_DELIVERY_DELAY:PT5S}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
    appointment-reminder-lead: ${APPOINTMENT_REMINDER_LEAD:PT24H}
    appointment-reminder-window: ${APPOINTMENT_REMINDER_WINDOW:PT5M}
    reminder-scan-delay: ${APPOINTMENT_REMINDER_SCAN_DELAY:PT5M}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true
    try-it-out-enabled: true
