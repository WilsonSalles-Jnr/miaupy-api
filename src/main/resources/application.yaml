spring:
  application:
    name: miaupy-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/miaupy}
    username: ${DB_USERNAME:miaupy}
    password: ${DB_PASSWORD:miaupy}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000/realms/miaupy}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/realms/miaupy/protocol/openid-connect/certs}
          audiences: ${AUTH_AUDIENCE:miaupy-api}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}] [tenantId=%X{tenantId:-}] [actorId=%X{actorId:-}]"

miaupy:
  identity:
    base-url: ${IDENTITY_BASE_URL:http://localhost:9000}
    realm: ${IDENTITY_REALM:miaupy}
    client-id: ${IDENTITY_CLIENT_ID:miaupy-onboarding-service}
    client-secret: ${IDENTITY_CLIENT_SECRET:local-onboarding-secret-change-me}
    consumer-client-id: ${IDENTITY_CONSUMER_CLIENT_ID:miaupy-consumer}
  onboarding:
    registration:
      ip-limit-per-hour: ${REGISTRATION_IP_LIMIT_PER_HOUR:10}
      email-limit-per-hour: ${REGISTRATION_EMAIL_LIMIT_PER_HOUR:3}
      key-secret: ${REGISTRATION_KEY_SECRET:local-rate-limit-secret-change-me}
  cache:
    public-catalog-ttl: ${PUBLIC_CATALOG_CACHE_TTL:PT5M}
  kafka:
    domain-events-topic: ${DOMAIN_EVENTS_TOPIC:miaupy.domain-events}
  outbox:
    publish-delay: ${OUTBOX_PUBLISH_DELAY:PT2S}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true
    try-it-out-enabled: true
